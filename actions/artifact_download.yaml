ref: github.artifact_download
label: "Download Actions Artifact"
description: "Download an artifact ZIP into a new confined file with a byte cap"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  artifact_id: {type: integer, minimum: 1, required: true}
  artifact_path: {type: string, required: true, description: "New relative ZIP file beneath ATTUNE_ARTIFACTS_DIR"}
  max_download_bytes: {type: integer, minimum: 1, maximum: 2147483648, default: 536870912}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, actions, artifact, download]
