ref: github.content_delete
label: "Delete Repository Content"
description: "Delete one path at an exact blob SHA after exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  path: {type: string, required: true}
  message: {type: string, required: true}
  sha: {type: string, required: true}
  branch: {type: string}
  confirmation: {type: string, required: true, description: "DELETE_CONTENT:<owner>/<repository>:<path>:<sha>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, content, delete, destructive]
