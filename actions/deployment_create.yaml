ref: github.deployment_create
label: "Create Deployment"
description: "Create an explicit deployment without implicit merging after exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  ref: {type: string, required: true}
  environment: {type: string, required: true}
  task: {type: string}
  description: {type: string}
  auto_merge: {type: boolean, default: false}
  required_contexts: {type: array, items: {type: string}, required: true, description: "Explicit required status contexts; use [] only when intentionally bypassing context checks"}
  transient_environment: {type: boolean}
  production_environment: {type: boolean}
  confirmation: {type: string, required: true, description: "CREATE_DEPLOYMENT:<owner>/<repository>:<ref>:<environment>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, deployment, create, confirmed]
