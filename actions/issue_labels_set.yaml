ref: github.issue_labels_set
label: "Set Issue Labels"
description: "Replace all labels on one issue after an exact sorted-label confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  issue_number: {type: integer, minimum: 1, required: true}
  labels: {type: array, items: {type: string}, required: true}
  confirmation: {type: string, required: true, description: "SET_ISSUE_LABELS:<owner>/<repository>:<issue_number>:<sorted,labels>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, issue, label, replace]
