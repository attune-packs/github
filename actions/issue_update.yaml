ref: github.issue_update
label: "Update Issue"
description: "Update selected fields on one issue"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  issue_number: {type: integer, minimum: 1, required: true}
  title: {type: string}
  body: {type: string}
  state: {type: string, enum: [closed, open]}
  state_reason: {type: string, enum: [completed, duplicate, not_planned, reopened]}
  milestone: {type: integer, minimum: 1}
  labels: {type: array, items: {type: string}}
  assignees: {type: array, items: {type: string}}
  expected_etag: {type: string}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, issue, update]
