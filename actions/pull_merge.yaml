ref: github.pull_merge
label: "Merge Pull Request"
description: "Merge only the explicitly expected pull-request head after exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  pull_number: {type: integer, minimum: 1, required: true}
  expected_head_sha: {type: string, required: true}
  merge_method: {type: string, enum: [merge, rebase, squash], default: merge}
  commit_title: {type: string}
  commit_message: {type: string}
  confirmation: {type: string, required: true, description: "MERGE:<owner>/<repository>:<pull_number>:<expected_head_sha>:<merge_method>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, pull-request, merge, destructive]
