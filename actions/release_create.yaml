ref: github.release_create
label: "Create Release"
description: "Create a release that defaults to draft for safe publication control"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: pack.github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  tag_name: {type: string, required: true}
  target_commitish: {type: string}
  name: {type: string}
  body: {type: string}
  draft: {type: boolean, default: true}
  prerelease: {type: boolean, default: false}
  generate_release_notes: {type: boolean, default: false}
  make_latest: {type: string, enum: [legacy, 'false', 'true']}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, release, create]
