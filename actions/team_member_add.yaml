ref: github.team_member_add
label: "Add Team Member"
description: "Add or update one team membership after exact organization/team/user/role confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  organization: {type: string, required: true}
  team_slug: {type: string, required: true}
  username: {type: string, required: true}
  role: {type: string, enum: [maintainer, member], default: member}
  confirmation: {type: string, required: true, description: "ADD_TEAM_MEMBER:<organization>:<team_slug>:<username>:<role>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, organization, team, member, confirmed]
