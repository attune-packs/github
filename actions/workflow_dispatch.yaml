ref: github.workflow_dispatch
label: "Dispatch Actions Workflow"
description: "Dispatch one workflow at an explicit ref after exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: github_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: github.credentials, required: true}
  owner: {type: string, required: true}
  repository: {type: string, required: true}
  workflow_id: {type: string, required: true}
  ref: {type: string, required: true}
  inputs: {type: object, default: {}, secret: true}
  confirmation: {type: string, required: true, description: "DISPATCH_WORKFLOW:<owner>/<repository>:<workflow_id>:<ref>"}
  timeout_seconds: {type: integer, minimum: 1, maximum: 120, default: 30}
  read_retries: {type: integer, minimum: 0, maximum: 2, default: 1}
output:
  operation: {type: string}
  data: {type: any}
  meta: {type: object}
tags: [github, actions, workflow, dispatch, confirmed]
