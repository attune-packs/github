ref: github
label: "GitHub Hosting Platform"
description: "Safe GitHub REST API operations with Attune Key-backed App or token authentication"
version: "0.1.0"
author: "Attune; adapted from StackStorm, Inc. and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: integration
  documentation_url: "https://docs.github.com/en/rest"
  repository_url: "https://github.com/attune-packs/github"
  source_repository: "https://github.com/StackStorm-Exchange/stackstorm-github"
  source_revision: "fc8e45bd25bcfdd891f3e88e0b87f7592fe7f634"
  source_version: "2.1.5"
  api_version: "2026-03-10"
  license: "Apache-2.0"

tags: [github, github-enterprise, repository-hosting, issues, pull-requests, actions, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
